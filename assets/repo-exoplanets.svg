    <rect x="72" y="0" width="50" height="22" rx="3" class="tag-box" />
    <text x="97" y="15" text-anchor="middle" class="tag-text">Dart</text>

    <rect x="130" y="0" width="80" height="22" rx="3" class="tag-box" />
    <text x="170" y="15" text-anchor="middle" class="tag-text">Astronomy</text>
