<svg width="840" height="32" viewBox="0 0 840 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .line { stroke: #2A2B31; stroke-width: 1; }
    .bar {
      transform-origin: center;
      animation: pulse 1.6s ease-in-out infinite alternate;
    }
    .gold { fill: #B08A4A; }
    .crimson { fill: #D85367; }
    .b1 { animation-delay: 0.0s; }
    .b2 { animation-delay: 0.2s; }
    .b3 { animation-delay: 0.4s; }
    .b4 { animation-delay: 0.1s; }
    .b5 { animation-delay: 0.5s; }
    .b6 { animation-delay: 0.3s; }
    .b7 { animation-delay: 0.6s; }
    @keyframes pulse {
      0% { transform: scaleY(0.35); opacity: 0.65; }
      100% { transform: scaleY(1); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bar { animation: none; }
    }
  </style>

  <!-- Left studio hairline -->
  <line x1="40" y1="16" x2="318" y2="16" class="line" />
  <circle cx="325" cy="16" r="2" fill="#B08A4A" />

  <!-- Center Equalizer / Soundwave -->
  <g transform="translate(345, 0)">
    <rect x="0"   y="11" width="2.5" height="10" rx="1.25" class="bar gold b1" />
    <rect x="7"   y="7"  width="2.5" height="18" rx="1.25" class="bar crimson b2" />
    <rect x="14"  y="10" width="2.5" height="12" rx="1.25" class="bar gold b3" />
    <rect x="21"  y="4"  width="2.5" height="24" rx="1.25" class="bar crimson b4" />
    <rect x="28"  y="8"  width="2.5" height="16" rx="1.25" class="bar gold b5" />
    <rect x="35"  y="12" width="2.5" height="8"  rx="1.25" class="bar gold b6" />
    <rect x="42"  y="5"  width="2.5" height="22" rx="1.25" class="bar crimson b7" />
    <rect x="49"  y="9"  width="2.5" height="14" rx="1.25" class="bar gold b2" />
    <rect x="56"  y="3"  width="2.5" height="26" rx="1.25" class="bar crimson b1" />
    <rect x="63"  y="7"  width="2.5" height="18" rx="1.25" class="bar gold b4" />
    <rect x="70"  y="10" width="2.5" height="12" rx="1.25" class="bar gold b3" />
    <rect x="77"  y="5"  width="2.5" height="22" rx="1.25" class="bar crimson b6" />
    <rect x="84"  y="8"  width="2.5" height="16" rx="1.25" class="bar gold b5" />
    <rect x="91"  y="11" width="2.5" height="10" rx="1.25" class="bar gold b7" />
    <rect x="98"  y="6"  width="2.5" height="20" rx="1.25" class="bar crimson b2" />
    <rect x="105" y="9"  width="2.5" height="14" rx="1.25" class="bar gold b1" />
    <rect x="112" y="4"  width="2.5" height="24" rx="1.25" class="bar crimson b4" />
    <rect x="119" y="10" width="2.5" height="12" rx="1.25" class="bar gold b3" />
    <rect x="126" y="7"  width="2.5" height="18" rx="1.25" class="bar crimson b5" />
    <rect x="133" y="11" width="2.5" height="10" rx="1.25" class="bar gold b6" />
    <rect x="140" y="13" width="2.5" height="6"  rx="1.25" class="bar gold b1" />
  </g>

  <!-- Right studio hairline -->
  <circle cx="515" cy="16" r="2" fill="#B08A4A" />
  <line x1="522" y1="16" x2="800" y2="16" class="line" />
</svg>
