<svg width="620" height="46" viewBox="0 0 620 46" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #16181D; stroke: #2A2B31; stroke-width: 1; }
    .accent { fill: #B08A4A; }
    .num {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      font-weight: 600;
      fill: #B08A4A;
    }
    .title {
      font-family: Georgia, 'Fraunces', 'Times New Roman', serif;
      font-size: 15px;
      font-weight: 600;
      fill: #F5F2EC;
    }
    .meta {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;
      font-size: 12px;
      fill: #A19E97;
    }
    .btn { fill: #0E0F13; stroke: #7A1C2A; stroke-width: 1; }
    .btn-text {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #B08A4A;
    }
    .wave { fill: #2A2B31; }
    .wave-hi { fill: #B08A4A; opacity: 0.65; }
  </style>
  <rect x="0.5" y="0.5" width="619" height="45" rx="6" class="bg" />
  <rect x="0.5" y="0.5" width="4" height="45" rx="2" class="accent" />

  <text x="20" y="28" class="num">05</text>
  <text x="50" y="28" class="title">Mambru</text>
  <text x="116" y="28" class="meta">· Amantina metal cover</text>

  <!-- Subtle Studio Waveform -->
  <g transform="translate(380, 13)">
    <rect x="0"  y="2" width="2" height="16" rx="1" class="wave-hi" />
    <rect x="5"  y="1" width="2" height="18" rx="1" class="wave-hi" />
    <rect x="10" y="4" width="2" height="12" rx="1" class="wave" />
    <rect x="15" y="1" width="2" height="18" rx="1" class="wave-hi" />
    <rect x="20" y="3" width="2" height="14" rx="1" class="wave" />
    <rect x="25" y="2" width="2" height="16" rx="1" class="wave-hi" />
    <rect x="30" y="5" width="2" height="10" rx="1" class="wave" />
    <rect x="35" y="1" width="2" height="18" rx="1" class="wave-hi" />
    <rect x="40" y="4" width="2" height="12" rx="1" class="wave" />
    <rect x="45" y="3" width="2" height="14" rx="1" class="wave-hi" />
  </g>

  <rect x="470" y="10" width="136" height="26" rx="4" class="btn" />
  <text x="538" y="27" text-anchor="middle" class="btn-text">▶ Play · SoundCloud</text>
</svg>
